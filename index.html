<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Neon Shift Tac Toe</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root {
  --x: #ff3355;
  --o: #00c8ff;
  --bg: #080b14;
  --panel: #0c1020;
  --border: #1e2840;
  --text: #c8d8f8;
  --dim: #5a6a90;
  --glow-x: rgba(255,51,85,0.35);
  --glow-o: rgba(0,200,255,0.35);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  min-height: 100vh;
  background: var(--bg);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Orbitron', sans-serif;
  color: var(--text);
  overflow: hidden;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(0,0,0,0.06) 2px,
    rgba(0,0,0,0.06) 4px
  );
  pointer-events: none;
  z-index: 100;
}

body::after {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(30,40,80,0.25) 1px, transparent 1px),
    linear-gradient(90deg, rgba(30,40,80,0.25) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
  z-index: 0;
}

.wrap {
  position: relative;
  z-index: 1;
  width: min(96vw, 420px);
  display: flex;
  flex-direction: column;
  gap: 10px;
  animation: fadeIn 0.6s ease both;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}

.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 2px;
}

.logo {
  font-size: clamp(1.1rem, 3.5vw, 1.4rem);
  font-weight: 900;
  letter-spacing: 5px;
  color: #fff;
  text-shadow: 0 0 10px rgba(100,140,255,0.8), 0 0 30px rgba(60,100,255,0.4);
  animation: logoGlow 3s ease-in-out infinite;
}

@keyframes logoGlow {
  0%,100% { text-shadow: 0 0 10px rgba(100,140,255,0.8), 0 0 30px rgba(60,100,255,0.4); }
  50% { text-shadow: 0 0 16px rgba(100,180,255,1), 0 0 45px rgba(60,130,255,0.6); }
}

.header-btns { display: flex; gap: 6px; }

.icon-btn {
  width: 34px;
  height: 34px;
  border-radius: 10px;
  background: var(--panel);
  border: 1px solid var(--border);
  color: var(--dim);
  font-size: 1rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
}
.icon-btn:hover {
  border-color: #3a6fff;
  color: #fff;
  box-shadow: 0 0 12px rgba(50,100,255,0.4);
  transform: translateY(-1px);
}

.settings-panel {
  position: absolute;
  top: 46px;
  right: 0;
  width: 200px;
  background: rgba(8,12,24,0.97);
  border: 1px solid #2a3a70;
  border-radius: 14px;
  padding: 14px;
  display: none;
  z-index: 50;
  backdrop-filter: blur(10px);
  box-shadow: 0 8px 32px rgba(0,0,20,0.6);
  animation: dropIn 0.2s ease both;
}

@keyframes dropIn {
  from { opacity: 0; transform: translateY(-8px) scale(0.96); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.settings-panel.open { display: block; }

.settings-panel label {
  display: block;
  font-size: 0.65rem;
  letter-spacing: 2px;
  color: var(--dim);
  margin-top: 10px;
  margin-bottom: 4px;
}

input[type=color] {
  width: 100%;
  height: 32px;
  border: none;
  background: none;
  cursor: pointer;
  border-radius: 6px;
}

.preset-btns { display: flex; gap: 5px; margin-top: 8px; }

.preset-btns button {
  flex: 1;
  padding: 5px 0;
  font-size: 0.6rem;
  letter-spacing: 0.5px;
  background: var(--panel);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 7px;
  cursor: pointer;
  font-family: 'Orbitron', sans-serif;
  transition: all 0.15s;
}
.preset-btns button:hover {
  border-color: #3a6fff;
  box-shadow: 0 0 8px rgba(50,100,255,0.3);
  transform: translateY(-1px);
}

.scores {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 8px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 8px 12px;
}

.score-side { display: flex; align-items: center; gap: 8px; }
.score-side.right { flex-direction: row-reverse; }

.score-marker {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.85rem;
  font-weight: 700;
  flex-shrink: 0;
}

.score-marker.x {
  background: rgba(255,51,85,0.15);
  color: var(--x);
  border: 1px solid rgba(255,51,85,0.4);
}

.score-marker.o {
  background: rgba(0,200,255,0.12);
  color: var(--o);
  border: 1px solid rgba(0,200,255,0.3);
}

.score-num {
  font-size: 1.4rem;
  font-weight: 700;
  transition: all 0.3s;
}

.score-num.x { color: var(--x); text-shadow: 0 0 12px var(--glow-x); }
.score-num.o { color: var(--o); text-shadow: 0 0 12px var(--glow-o); }
.score-sep { font-size: 0.7rem; color: var(--dim); letter-spacing: 1px; }

.infobar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 2px;
}

.status {
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.8rem;
  color: var(--dim);
  letter-spacing: 1px;
  transition: color 0.3s;
  min-height: 20px;
}

.status.active-x { color: var(--x); }
.status.active-o { color: var(--o); }
.status.win { color: #ffd700; font-size: 0.85rem; }

.timer-wrap { display: flex; align-items: center; gap: 6px; }

.timer-bar-bg {
  width: 70px;
  height: 5px;
  background: rgba(255,255,255,0.08);
  border-radius: 99px;
  overflow: hidden;
}

.timer-bar {
  height: 100%;
  border-radius: 99px;
  background: #00ffe1;
  transition: width 0.1s linear, background 0.4s;
}

.timer-val {
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.95rem;
  font-weight: 700;
  color: #00ffe1;
  min-width: 36px;
  text-align: right;
  transition: color 0.3s;
}

.board {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  position: relative;
}

.cell {
  aspect-ratio: 1;
  background: linear-gradient(135deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
  border: 1px solid var(--border);
  border-radius: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: clamp(1.8rem, 8vw, 2.4rem);
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: border-color 0.2s, box-shadow 0.2s, transform 0.15s;
  user-select: none;
}

.cell:hover:not(.taken) {
  border-color: rgba(100,140,255,0.5);
  box-shadow: 0 0 16px rgba(60,100,255,0.2), inset 0 0 20px rgba(60,100,255,0.05);
  transform: scale(1.02);
}

.cell.taken { cursor: default; }

.cell .mark {
  position: relative;
  z-index: 1;
  transform-origin: center;
}

/* Pop animation — short & snappy */
.cell.place-anim .mark {
  animation: markPop 0.18s cubic-bezier(0.34, 1.56, 0.64, 1) both;
}

@keyframes markPop {
  from { opacity: 0; transform: scale(0.5); }
  to { opacity: 1; transform: scale(1); }
}

/* Vanish on the OLD cell — purely visual, non-blocking */
.cell.vanish-anim {
  animation: markVanish 0.18s ease-in both;
}

@keyframes markVanish {
  from { opacity: 1; transform: scale(1); }
  to { opacity: 0; transform: scale(0.5); }
}

.cell .x-mark { color: var(--x); text-shadow: 0 0 12px var(--x), 0 0 30px rgba(255,51,85,0.5); }
.cell .o-mark { color: var(--o); text-shadow: 0 0 12px var(--o), 0 0 30px rgba(0,200,255,0.4); }

.cell.warn-x {
  border-color: rgba(255,51,85,0.6);
  box-shadow: 0 0 14px var(--glow-x), inset 0 0 14px rgba(255,51,85,0.06);
  animation: warnPulseX 1.2s ease-in-out infinite;
}

.cell.warn-o {
  border-color: rgba(0,200,255,0.55);
  box-shadow: 0 0 14px var(--glow-o), inset 0 0 14px rgba(0,200,255,0.06);
  animation: warnPulseO 1.2s ease-in-out infinite;
}

@keyframes warnPulseX {
  0%,100% { box-shadow: 0 0 8px var(--glow-x), inset 0 0 10px rgba(255,51,85,0.04); }
  50% { box-shadow: 0 0 20px var(--glow-x), inset 0 0 18px rgba(255,51,85,0.1); }
}

@keyframes warnPulseO {
  0%,100% { box-shadow: 0 0 8px var(--glow-o), inset 0 0 10px rgba(0,200,255,0.04); }
  50% { box-shadow: 0 0 20px var(--glow-o), inset 0 0 18px rgba(0,200,255,0.1); }
}

.cell.win-flash { animation: winFlash 0.5s ease both; }

@keyframes winFlash {
  0% { transform: scale(1); }
  50% { transform: scale(1.08); filter: brightness(1.4); }
  100% { transform: scale(1); }
}

@keyframes dangerShake {
  0%,100% { transform: translateX(0); }
  25% { transform: translateX(-2px); }
  75% { transform: translateX(2px); }
}

.danger-anim { animation: dangerShake 0.15s ease infinite; }

.controls { display: flex; gap: 8px; }

.btn {
  flex: 1;
  padding: 10px;
  font-family: 'Orbitron', sans-serif;
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 2px;
  border: 1px solid var(--border);
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--panel);
  color: var(--text);
}

.btn-primary {
  background: linear-gradient(135deg, rgba(50,90,220,0.3), rgba(80,50,200,0.3));
  border-color: rgba(80,120,255,0.5);
  color: #fff;
}

.btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 4px 16px rgba(50,100,255,0.3);
  border-color: rgba(100,150,255,0.6);
}

.btn:active { transform: translateY(0); }

@keyframes scorePop {
  0% { transform: scale(1); }
  40% { transform: scale(1.4); }
  100% { transform: scale(1); }
}
.score-pop { animation: scorePop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }

/* ===== TUTORIAL MODAL ===== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(4px);
  animation: fadeIn 0.3s ease both;
}

@keyframes fadeOut {
  from { opacity: 1; }
  to { opacity: 0; }
}

.modal {
  width: min(92vw, 380px);
  background: rgba(8,12,24,0.98);
  border: 1px solid rgba(50,90,220,0.5);
  border-radius: 20px;
  padding: 22px;
  box-shadow: 0 0 60px rgba(30,60,200,0.25), 0 20px 60px rgba(0,0,0,0.6);
  animation: modalIn 0.35s cubic-bezier(0.34, 1.3, 0.64, 1) both;
}

@keyframes modalIn {
  from { opacity: 0; transform: scale(0.85) translateY(20px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}

.modal-title {
  font-size: 0.95rem;
  font-weight: 900;
  letter-spacing: 4px;
  color: #fff;
  text-align: center;
  margin-bottom: 4px;
  text-shadow: 0 0 20px rgba(100,150,255,0.8);
}

.tut-step-num {
  font-family: 'Share Tech Mono', monospace;
  text-align: center;
  font-size: 0.65rem;
  color: var(--dim);
  letter-spacing: 2px;
  margin-bottom: 18px;
}

.tut-board {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  margin: 14px 0;
}

.tut-cell {
  aspect-ratio: 1;
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--border);
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.4rem;
  transition: all 0.3s;
  position: relative;
}

.tut-cell .mark { transition: all 0.3s; }

.tut-cell.highlight-x {
  border-color: rgba(255,51,85,0.6);
  box-shadow: 0 0 12px var(--glow-x);
  background: rgba(255,51,85,0.06);
  animation: warnPulseX 1.2s ease-in-out infinite;
}

.tut-cell.highlight-o {
  border-color: rgba(0,200,255,0.5);
  box-shadow: 0 0 12px var(--glow-o);
  background: rgba(0,200,255,0.05);
  animation: warnPulseO 1.2s ease-in-out infinite;
}

.tut-cell.drop-in .mark {
  animation: markPop 0.18s cubic-bezier(0.34, 1.56, 0.64, 1) both;
}

.tut-cell.fade-out .mark {
  animation: markVanish 0.18s ease both;
}

.tut-desc {
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.72rem;
  line-height: 1.65;
  color: var(--text);
  text-align: center;
  margin-bottom: 14px;
  min-height: 52px;
}

.tut-desc span.hi-x { color: var(--x); font-weight: 700; }
.tut-desc span.hi-o { color: var(--o); font-weight: 700; }
.tut-desc span.hi-y { color: #ffd700; font-weight: 700; }

.tut-nav {
  display: flex;
  gap: 8px;
  align-items: center;
  justify-content: space-between;
}

.tut-dots { display: flex; gap: 5px; align-items: center; }

.tut-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--border);
  transition: all 0.3s;
}

.tut-dot.active {
  background: #4a7fff;
  box-shadow: 0 0 8px rgba(74,127,255,0.6);
  width: 18px;
  border-radius: 3px;
}

.tut-btn {
  padding: 8px 18px;
  font-family: 'Orbitron', sans-serif;
  font-size: 0.65rem;
  font-weight: 700;
  letter-spacing: 1.5px;
  border: 1px solid rgba(80,120,255,0.4);
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.2s;
  background: rgba(40,70,200,0.25);
  color: #fff;
}

.tut-btn:hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 14px rgba(50,100,255,0.3);
  background: rgba(40,70,200,0.4);
}

.tut-btn.dim {
  background: transparent;
  border-color: var(--border);
  color: var(--dim);
}

.tut-btn.dim:hover {
  background: rgba(255,255,255,0.04);
  border-color: rgba(100,120,160,0.5);
  color: var(--text);
}

.particle {
  position: fixed;
  pointer-events: none;
  border-radius: 50%;
  z-index: 300;
  animation: particleFly var(--dur) ease-out both;
}

@keyframes particleFly {
  from { transform: translate(0,0) scale(1); opacity: 1; }
  to { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
}
</style>
</head>
<body>

<div class="wrap" id="wrap">
  <div class="header">
    <div class="logo">NEON SHIFT</div>
    <div class="header-btns">
      <button class="icon-btn" id="tutBtn" title="Tutorial">?</button>
      <button class="icon-btn" id="settingsBtn" title="Settings">⚙</button>
    </div>
  </div>

  <div class="settings-panel" id="settingsPanel">
    <label>X COLOR</label>
    <input type="color" id="xColor" value="#ff3355">
    <label>O COLOR</label>
    <input type="color" id="oColor" value="#00c8ff">
    <label>PRESETS</label>
    <div class="preset-btns">
      <button onclick="setTheme('#ff3355','#00c8ff')">Classic</button>
      <button onclick="setTheme('#00ff99','#ff00cc')">Cyber</button>
      <button onclick="setTheme('#ffd000','#00e5ff')">Arcade</button>
    </div>
  </div>

  <div class="scores">
    <div class="score-side left">
      <div class="score-marker x">X</div>
      <div class="score-num x" id="scoreX">0</div>
    </div>
    <div class="score-sep">VS</div>
    <div class="score-side right">
      <div class="score-num o" id="scoreO">0</div>
      <div class="score-marker o">O</div>
    </div>
  </div>

  <div class="infobar">
    <div class="status" id="status">PRESS START</div>
    <div class="timer-wrap">
      <div class="timer-bar-bg"><div class="timer-bar" id="timerBar"></div></div>
      <div class="timer-val" id="timerVal">8.0</div>
    </div>
  </div>

  <div class="board" id="board"></div>

  <div class="controls">
    <button class="btn btn-primary" id="startBtn">START</button>
    <button class="btn" id="resetBtn">RESET</button>
  </div>
</div>

<!-- Tutorial Modal -->
<div class="modal-overlay" id="tutOverlay" style="display:none;">
  <div class="modal" id="tutModal">
    <div class="modal-title">HOW TO PLAY</div>
    <div class="tut-step-num" id="tutStepNum">STEP 1 / 4</div>
    <div class="tut-board" id="tutBoard"></div>
    <div class="tut-desc" id="tutDesc"></div>
    <div class="tut-nav">
      <button class="tut-btn dim" id="tutPrev">← BACK</button>
      <div class="tut-dots" id="tutDots"></div>
      <button class="tut-btn" id="tutNext">NEXT →</button>
    </div>
  </div>
</div>

<script>
// ── State ──────────────────────────────────────────────────────────────
let board = Array(9).fill('');
let history = { X: [], O: [] };
let current = 'X';
let started = false;
let over = false;
let timerInterval = null;
let timeLeft = 8;
let timerLimit = 8;
let gameStart = 0;
let scores = { X: 0, O: 0 };

// ── Settings ───────────────────────────────────────────────────────────
document.getElementById('settingsBtn').onclick = () =>
  document.getElementById('settingsPanel').classList.toggle('open');

document.addEventListener('click', e => {
  if (!e.target.closest('#settingsPanel') && !e.target.closest('#settingsBtn'))
    document.getElementById('settingsPanel').classList.remove('open');
});

document.getElementById('xColor').addEventListener('input', e =>
  document.documentElement.style.setProperty('--x', e.target.value));
document.getElementById('oColor').addEventListener('input', e =>
  document.documentElement.style.setProperty('--o', e.target.value));

function setTheme(x, o) {
  document.documentElement.style.setProperty('--x', x);
  document.documentElement.style.setProperty('--o', o);
  document.getElementById('xColor').value = x;
  document.getElementById('oColor').value = o;
}

// ── Board ──────────────────────────────────────────────────────────────
function buildBoard() {
  const el = document.getElementById('board');
  el.innerHTML = '';
  for (let i = 0; i < 9; i++) {
    const c = document.createElement('div');
    c.className = 'cell';
    c.dataset.i = i;
    c.addEventListener('click', () => move(i));
    el.appendChild(c);
  }
}

function renderBoard(animIdx = -1) {
  const cells = document.querySelectorAll('#board .cell');
  cells.forEach((c, i) => {
    const v = board[i];
    let cls = 'cell' + (v ? ' taken' : '');
    if (i === animIdx) cls += ' place-anim';
    c.className = cls;
    c.innerHTML = v
      ? `<span class="mark ${v === 'X' ? 'x-mark' : 'o-mark'}">${v}</span>`
      : '';
  });
  applyWarnings();
}

function applyWarnings() {
  if (!started || over) return;
  const cells = document.querySelectorAll('#board .cell');
  cells.forEach(c => c.classList.remove('warn-x', 'warn-o'));
  if (history.X.length === 3) cells[history.X[0]].classList.add('warn-x');
  if (history.O.length === 3) cells[history.O[0]].classList.add('warn-o');
}

// ── Move Logic — fully synchronous, no awaiting animations ─────────────
function move(idx) {
  if (!started || over || board[idx]) return;

  const ph = history[current];

  // If player already has 3 pieces, remove oldest immediately
  // but fire a visual-only vanish animation (non-blocking)
  if (ph.length === 3) {
    const removeIdx = ph.shift();
    const rc = document.querySelectorAll('#board .cell')[removeIdx];
    // Trigger vanish CSS animation — purely cosmetic, doesn't block
    rc.classList.add('vanish-anim');
    // After animation ends, clear the cell (board already updated below)
    setTimeout(() => {
      if (rc) rc.classList.remove('vanish-anim');
    }, 180);
    board[removeIdx] = '';
  }

  // Place new piece immediately
  board[idx] = current;
  ph.push(idx);
  renderBoard(idx);

  const win = checkWin(current);
  if (win) {
    celebrate(win, current);
    return;
  }
  current = current === 'X' ? 'O' : 'X';
  setStatus(`${current}'S TURN`, 'active-' + current.toLowerCase());
  resetTimer();
}

function checkWin(p) {
  const lines = [
    [0,1,2],[3,4,5],[6,7,8],
    [0,3,6],[1,4,7],[2,5,8],
    [0,4,8],[2,4,6]
  ];
  return lines.find(l => l.every(i => board[i] === p)) || null;
}

// ── Celebrate ──────────────────────────────────────────────────────────
function celebrate(line, p) {
  over = true;
  clearInterval(timerInterval);
  timerInterval = null;

  scores[p]++;
  const se = document.getElementById(`score${p}`);
  se.textContent = scores[p];
  se.classList.add('score-pop');
  setTimeout(() => se.classList.remove('score-pop'), 500);

  const cells = document.querySelectorAll('#board .cell');
  line.forEach((i, n) => {
    setTimeout(() => cells[i].classList.add('win-flash'), n * 80);
  });

  setStatus(`${p} WINS! 🏆`, 'win');
  fireworks(p);
}

function fireworks(p) {
  const color = getComputedStyle(document.documentElement)
    .getPropertyValue(p === 'X' ? '--x' : '--o').trim();
  const cx = window.innerWidth / 2;
  const cy = window.innerHeight / 2;
  for (let i = 0; i < 28; i++) {
    const el = document.createElement('div');
    el.className = 'particle';
    const angle = (i / 28) * 360;
    const dist = 80 + Math.random() * 120;
    const tx = Math.cos(angle * Math.PI / 180) * dist;
    const ty = Math.sin(angle * Math.PI / 180) * dist;
    const size = 4 + Math.random() * 6;
    el.style.cssText = `
      left:${cx}px; top:${cy}px;
      width:${size}px; height:${size}px;
      background:${color};
      box-shadow: 0 0 ${size * 2}px ${color};
      --tx:${tx}px; --ty:${ty}px;
      --dur:${0.5 + Math.random() * 0.5}s;
    `;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1100);
  }
}

// ── Timer ──────────────────────────────────────────────────────────────
function getTurnLimit() {
  const e = (Date.now() - gameStart) / 1000;
  if (e < 30) return 8;
  if (e < 55) return 7;
  if (e < 80) return 6;
  if (e < 105) return 5;
  if (e < 130) return 4;
  if (e < 160) return 3;
  if (e < 240) return 2;
  if (e < 270) return 1.5;
  if (e < 300) return 1;
  return 0.5;
}

function resetTimer() {
  clearInterval(timerInterval);
  timerLimit = getTurnLimit();
  timeLeft = timerLimit;
  updateTimer();
  timerInterval = setInterval(() => {
    timeLeft = Math.max(0, timeLeft - 0.05);
    updateTimer();
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      over = true;
      const w = current === 'X' ? 'O' : 'X';
      scores[w]++;
      const se = document.getElementById(`score${w}`);
      se.textContent = scores[w];
      se.classList.add('score-pop');
      setTimeout(() => se.classList.remove('score-pop'), 500);
      setStatus(`${current} TIMED OUT! ${w} WINS!`, 'win');
      fireworks(w);
    }
  }, 50);
}

function updateTimer() {
  const pct = timerLimit > 0 ? timeLeft / timerLimit : 0;
  const bar = document.getElementById('timerBar');
  const val = document.getElementById('timerVal');
  bar.style.width = (pct * 100) + '%';
  val.textContent = timeLeft.toFixed(1);

  let col;
  if (pct > 0.5) col = '#00ffe1';
  else if (pct > 0.3) col = '#ffe600';
  else if (pct > 0.15) col = '#ff7b00';
  else col = '#ff2222';
  val.style.color = col;
  bar.style.background = col;

  const wrap = document.getElementById('wrap');
  if (pct < 0.15) wrap.classList.add('danger-anim');
  else wrap.classList.remove('danger-anim');
}

// ── Game Flow ──────────────────────────────────────────────────────────
function startGame() {
  board = Array(9).fill('');
  history = { X: [], O: [] };
  current = 'X';
  started = true;
  over = false;
  gameStart = Date.now();
  buildBoard();
  setStatus("X'S TURN", 'active-x');
  resetTimer();
}

document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('resetBtn').addEventListener('click', () => {
  clearInterval(timerInterval);
  timerInterval = null;
  started = false;
  over = false;
  board = Array(9).fill('');
  history = { X: [], O: [] };
  current = 'X';
  buildBoard();
  setStatus('PRESS START', '');
  const val = document.getElementById('timerVal');
  val.textContent = '8.0';
  val.style.color = '#00ffe1';
  document.getElementById('timerBar').style.width = '100%';
  document.getElementById('timerBar').style.background = '#00ffe1';
  document.getElementById('wrap').classList.remove('danger-anim');
});

function setStatus(text, cls) {
  const s = document.getElementById('status');
  s.textContent = text;
  s.className = 'status' + (cls ? ' ' + cls : '');
}

// ── Tutorial ───────────────────────────────────────────────────────────
const TUT_SEEN_KEY = 'neonshift_tut_seen';

const tutSteps = [
  {
    desc: `<span class="hi-x">X</span> and <span class="hi-o">O</span> take turns placing pieces.<br>Get <span class="hi-y">three in a row</span> to win — horizontally, vertically, or diagonally.`,
    anim: 'intro'
  },
  {
    desc: `Each player can only have <span class="hi-y">3 pieces</span> on the board at once.<br>On your 4th move, your <span class="hi-y">oldest piece disappears</span> — the board keeps shifting!`,
    anim: 'shift'
  },
  {
    desc: `When you have 3 pieces down, your <span class="hi-y">oldest piece glows</span> — that's the one that'll vanish on your next move. Plan around it!`,
    anim: 'warn'
  },
  {
    desc: `The <span class="hi-y">timer shrinks</span> as the game goes on — stay sharp! Run out of time and your opponent wins the round.`,
    anim: 'timer'
  },
];

let tutStep = 0;
let tutAnimTimer = null;

function openTutorial() {
  tutStep = 0;
  const o = document.getElementById('tutOverlay');
  o.style.display = 'flex';
  o.style.animation = 'fadeIn 0.3s ease both';
  renderTutStep();
}

function closeTutorial() {
  const o = document.getElementById('tutOverlay');
  o.style.animation = 'fadeOut 0.25s ease both';
  setTimeout(() => { o.style.display = 'none'; }, 250);
  if (tutAnimTimer) { clearTimeout(tutAnimTimer); tutAnimTimer = null; }
  // Mark as seen so it never auto-opens again
  try { localStorage.setItem(TUT_SEEN_KEY, '1'); } catch(e) {}
}

function renderTutStep() {
  if (tutAnimTimer) { clearTimeout(tutAnimTimer); tutAnimTimer = null; }
  const step = tutSteps[tutStep];
  document.getElementById('tutStepNum').textContent = `STEP ${tutStep + 1} / ${tutSteps.length}`;
  document.getElementById('tutDesc').innerHTML = step.desc;

  const dots = document.getElementById('tutDots');
  dots.innerHTML = '';
  tutSteps.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'tut-dot' + (i === tutStep ? ' active' : '');
    dots.appendChild(d);
  });

  document.getElementById('tutPrev').style.visibility = tutStep === 0 ? 'hidden' : 'visible';
  document.getElementById('tutNext').textContent = tutStep === tutSteps.length - 1 ? 'PLAY →' : 'NEXT →';

  runTutAnim(step.anim);
}

function makeTutBoard(state) {
  const tb = document.getElementById('tutBoard');
  tb.innerHTML = '';
  for (let i = 0; i < 9; i++) {
    const c = document.createElement('div');
    c.className = 'tut-cell';
    c.id = `tc${i}`;
    if (state[i]) {
      c.innerHTML = `<span class="mark ${state[i] === 'X' ? 'x-mark' : 'o-mark'}">${state[i]}</span>`;
    }
    tb.appendChild(c);
  }
}

function scheduleAnim(fn, ms) {
  tutAnimTimer = setTimeout(fn, ms);
}

async function runTutAnim(type) {
  const tb = document.getElementById('tutBoard');

  if (type === 'intro') {
    makeTutBoard(Array(9).fill(''));
    const seq = [[0,'X'],[1,'O'],[2,'X']];
    let delay = 400;
    seq.forEach(([i, p]) => {
      scheduleAnim(() => {
        const tc = document.getElementById(`tc${i}`);
        if (!tc) return;
        tc.innerHTML = `<span class="mark ${p === 'X' ? 'x-mark' : 'o-mark'}">${p}</span>`;
        tc.classList.add('drop-in');
        setTimeout(() => tc.classList.remove('drop-in'), 200);
      }, delay);
      delay += 350;
    });
    scheduleAnim(() => {
      [0,1,2].forEach(i => document.getElementById(`tc${i}`)?.classList.add('highlight-x'));
    }, delay + 200);
  }

  else if (type === 'shift') {
    makeTutBoard(['X','O','','X','O','','X','','']);
    scheduleAnim(() => {
      document.getElementById('tc0')?.classList.add('highlight-x');
    }, 500);
    scheduleAnim(() => {
      const tc0 = document.getElementById('tc0');
      if (tc0) {
        tc0.classList.add('fade-out');
        setTimeout(() => {
          if (tc0) { tc0.innerHTML = ''; tc0.classList.remove('highlight-x','fade-out'); }
        }, 180);
      }
      scheduleAnim(() => {
        const tc7 = document.getElementById('tc7');
        if (tc7) {
          tc7.innerHTML = `<span class="mark x-mark">X</span>`;
          tc7.classList.add('drop-in');
          setTimeout(() => tc7.classList.remove('drop-in'), 200);
        }
      }, 100);
    }, 1100);
  }

  else if (type === 'warn') {
    makeTutBoard(['X','O','','X','O','','X','','']);
    scheduleAnim(() => {
      document.getElementById('tc0')?.classList.add('highlight-x');
      document.getElementById('tc3')?.classList.add('highlight-o');
    }, 300);
  }

  else if (type === 'timer') {
    tb.innerHTML = `
      <div style="grid-column:1/-1; display:flex; flex-direction:column; align-items:center; gap:10px; padding: 8px 0;">
        <div style="font-family:'Share Tech Mono',monospace; font-size:0.7rem; color:var(--dim); letter-spacing:2px;">TIME LIMIT PER TURN</div>
        <div id="tut-timer-demo" style="font-size:2.2rem; font-weight:700; font-family:'Orbitron',sans-serif; color:#00ffe1; text-shadow: 0 0 12px #00ffe1; transition:color 0.3s;">8.0s</div>
        <div style="width:80%; height:6px; background:rgba(255,255,255,0.08); border-radius:99px; overflow:hidden;">
          <div id="tut-bar" style="height:100%; border-radius:99px; background:#00ffe1; width:100%; transition:width 0.3s, background 0.3s;"></div>
        </div>
        <div style="font-family:'Share Tech Mono',monospace; font-size:0.65rem; color:var(--dim); text-align:center; margin-top:4px;">Gets shorter as the game progresses</div>
      </div>
    `;
    let t = 8;
    const lim = 8;
    function tick() {
      if (t < 0) t = 8;
      const d = document.getElementById('tut-timer-demo');
      const bar = document.getElementById('tut-bar');
      if (!d) return;
      d.textContent = t.toFixed(1) + 's';
      const pct = t / lim;
      if (bar) bar.style.width = (pct * 100) + '%';
      let col = '#00ffe1';
      if (pct <= 0.5) col = '#ffe600';
      if (pct <= 0.3) col = '#ff7b00';
      if (pct <= 0.15) col = '#ff2222';
      d.style.color = col;
      d.style.textShadow = `0 0 12px ${col}`;
      if (bar) bar.style.background = col;
      t -= 0.3;
      tutAnimTimer = setTimeout(tick, 120);
    }
    tick();
  }
}

document.getElementById('tutBtn').onclick = openTutorial;
document.getElementById('tutOverlay').addEventListener('click', e => {
  if (e.target === document.getElementById('tutOverlay')) closeTutorial();
});

document.getElementById('tutNext').onclick = () => {
  if (tutStep < tutSteps.length - 1) {
    tutStep++;
    renderTutStep();
  } else {
    closeTutorial();
  }
};

document.getElementById('tutPrev').onclick = () => {
  if (tutStep > 0) { tutStep--; renderTutStep(); }
};

// ── Init ──────────────────────────────────────────────────────────────
buildBoard();

// Only show tutorial automatically if never seen before
try {
  if (!localStorage.getItem(TUT_SEEN_KEY)) openTutorial();
} catch(e) {
  openTutorial(); // if localStorage unavailable, show it
}
</script>

</html>
